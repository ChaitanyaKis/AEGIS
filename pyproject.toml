[project]
name = "aegis"
version = "0.1.0"
description = "AEGIS — Autonomous Enterprise Agent Command & Governance Fleet: a governed control plane for autonomous enterprise agent fleets."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]
gemini = [
    "google-genai>=1.0",
]
crypto = [
    # Ed25519 for the remote A2A boundary. Deliberately optional: the deterministic safety
    # benchmark pins HMAC-SHA256 from the standard library, so it runs with no third-party
    # package at all. When this is absent, a message naming Ed25519 is refused rather than
    # verified some other way -- a missing provider is never a downgrade.
    "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aegis"]
